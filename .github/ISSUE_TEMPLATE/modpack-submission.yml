# Modpack submission form. The Modpacks tab of the mod manager pre-fills this
# from whatever setup you have open, for people who don't want to sign in.
#
# Unlike a mod submission, an open modpack issue IS listed automatically on the
# next index refresh. A modpack holds no code: everything in it was already in
# the registry, and each part is still downloaded from its own author's release
# and checked against its own checksum. Committing the file to
# registry/modpacks/ and closing the issue is how a pack graduates to curated.
name: Share a modpack
description: Share your whole setup - the mods you play with and the texture pack you wear. Modpacks contain no code, just a list of things already in the registry.
title: '[Modpack] '
labels: [modpack-submission]
body:
  - type: markdown
    attributes:
      value: |
        A modpack is a setup other people can install in one click: a name, a
        blurb, the registry ids of the mods in it, and optionally the registry
        ids of the texture packs it wears. Rules:
        - at least **one mod, or a texture pack** (both is the usual case)
        - as many mods and texture packs as your setup actually has
        - everything must already be **listed in the registry** - open the mod
          manager and check that each one shows up under Browse mods
        - dependencies (like `gambit-api`) come along automatically, no need
          to list them

        Mods that are still **unreviewed** are allowed. Your modpack will
        simply carry a warning icon naming them, so people know what they are
        installing before they install it.
  - type: input
    id: pack-name
    attributes:
      label: Pack name
      description: Shown in the manager. 2-48 characters.
      placeholder: My Perfect Loadout
    validations:
      required: true
  - type: input
    id: pack-id
    attributes:
      label: Registry id
      description: lowercase-with-dashes, permanent. Leave blank to derive it from the name.
      placeholder: my-perfect-loadout
  - type: input
    id: mods
    attributes:
      label: Mods in the pack
      description: Comma-separated registry ids, in suggested install order.
      placeholder: kamikaze-gambit, spikes-gambit, better-collection
  - type: input
    id: texturepacks
    attributes:
      label: Texture packs
      description: >-
        Optional. Registry ids of the texture packs this setup wears, comma-separated,
        HIGHEST PRECEDENCE FIRST - where two packs change the same sprite or line, the
        first one listed wins. They install and get worn along with the mods.
      placeholder: my-hud-tweaks, midnight-chess
  - type: input
    id: summary
    attributes:
      label: One-line summary
      description: Shown on the pack card. 8-140 characters - what is this pack FOR?
      placeholder: Everything you need for a chaos-gambit run.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Longer description
      description: Optional. Why these mods together?
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Every mod and texture pack listed above is already visible in the manager (reviewed or not).
          required: true

# Publishes the download site (site/) plus the registry index to GitHub Pages
# at https://bentrd.github.io/GambonanzaMods/. Runs whenever either changes.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'registry/index.json'
      - 'registry/assets/**'
      - 'tools/make-site-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/registry/assets
          cp -r site/* _site/
          cp registry/index.json _site/registry/index.json
          cp registry/schema.json _site/registry/schema.json
          cp registry/modpack-schema.json _site/registry/modpack-schema.json
          cp registry/texturepack-schema.json _site/registry/texturepack-schema.json
          # The asset catalogue the mod manager's Texture packs tab browses:
          # every sprite and texture with the rectangle it occupies on its
          # sheet, plus every localised string. Generated from a game install
          # by tools/build-asset-catalog.py and refreshed on game updates.
          cp registry/assets/catalog.json _site/registry/assets/catalog.json
          cp registry/assets/texts.json _site/registry/assets/texts.json

      # One static page per registry entry at /<type>/<id>/, so a pasted link
      # unfurls as that mod (Discord's crawler runs no JavaScript). Humans get
      # bounced straight to the live #/<type>/<id> route.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Share pages for every registry entry
        run: node tools/make-site-pages.mjs _site

      # enablement lets the workflow turn Pages on (source: GitHub Actions)
      # by itself on first run, instead of failing until someone visits
      # Settings → Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

# Publishes the download site (site/) plus the registry index to GitHub Pages
# at https://bentrd.github.io/GambonanzaMods/. Runs whenever either changes.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'registry/index.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/registry
          cp -r site/* _site/
          cp registry/index.json _site/registry/index.json
          cp registry/schema.json _site/registry/schema.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

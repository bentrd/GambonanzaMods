# Publishes the download site (site/) plus the registry index to GitHub Pages
# at https://bentrd.github.io/GambonanzaMods/. Runs whenever either changes.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'registry/index.json'
      - 'registry/assets/**'
      - 'tools/make-site-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/registry/assets
          cp -r site/* _site/
          cp registry/index.json _site/registry/index.json
          cp registry/schema.json _site/registry/schema.json
          cp registry/modpack-schema.json _site/registry/modpack-schema.json
          cp registry/texturepack-schema.json _site/registry/texturepack-schema.json
          # The asset catalogue the mod manager's Resource packs tab browses:
          # every sprite and texture with the rectangle it occupies on its
          # sheet, plus every localised string. Generated from a game install
          # by tools/build-asset-catalog.py and refreshed on game updates.
          cp registry/assets/catalog.json _site/registry/assets/catalog.json
          cp registry/assets/audio.json _site/registry/assets/audio.json
          cp -r registry/assets/audio _site/registry/assets/audio
          cp registry/assets/texts.json _site/registry/assets/texts.json

      # One static page per registry entry at /<type>/<id>/, so a pasted link
      # unfurls as that mod (Discord's crawler runs no JavaScript). Humans get
      # bounced straight to the live #/<type>/<id> route.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Share pages for every registry entry
        run: node tools/make-site-pages.mjs _site

      # enablement lets the workflow turn Pages on (source: GitHub Actions)
      # by itself on first run, instead of failing until someone visits
      # Settings → Pages.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        id: pages-artifact
        with:
          path: _site
      - name: Wait for the Pages artifact to be available
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          # Upload can finish before the artifact is visible to deployment.
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and (.expired | not)) | .id' \
              | grep -Fqx "$PAGES_ARTIFACT_ID"; then
              sleep 5
              exit 0
            fi
            sleep 3
          done
          echo "::error::GitHub did not make Pages artifact $PAGES_ARTIFACT_ID available"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

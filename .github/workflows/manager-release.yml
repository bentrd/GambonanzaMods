# Mod manager release: runs on manager-v* tags. Builds the Electron app for
# macOS (dmg, arm64 + x64), Windows (installer) and Linux (AppImage), and
# attaches everything to one GitHub release. The download site and the app's
# own update check both read this release.
name: Manager release

on:
  push:
    tags:
      - 'manager-v*'

permissions:
  contents: write
  actions: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#manager-v}"
          version="$(node -p "require('./tools/GambonanzaModManager/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag manager-v$tag does not match the app's package.json version ($version)." >&2
            exit 1
          fi
      - name: Extract changelog section
        run: |
          tag="${GITHUB_REF_NAME#manager-v}"
          if [ -f tools/GambonanzaModManager/CHANGELOG.md ]; then
            awk -v ver="$tag" '
              $0 ~ "^## \\[?"ver"\\]?" { grab=1; next }
              grab && /^## / { exit }
              grab { print }
            ' tools/GambonanzaModManager/CHANGELOG.md > /tmp/notes.md
          fi
          [ -s /tmp/notes.md ] || echo "Gambonanza Mod Manager $tag." > /tmp/notes.md
      - name: Create the release (empty, assets attach below)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "Mod Manager ${GITHUB_REF_NAME#manager-v}" \
              --notes-file /tmp/notes.md

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: tools/GambonanzaModManager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle the offline registry index
        run: |
          mkdir -p assets
          cp ../../registry/index.json assets/registry-index.json

      - name: Bake the OAuth client id for "Sign in with GitHub" (optional)
        if: env.CLIENT_ID != ''
        env:
          CLIENT_ID: ${{ secrets.GAMBONANZA_GITHUB_CLIENT_ID }}
        run: |
          node -e "require('fs').writeFileSync('assets/github-oauth.json', JSON.stringify({ clientId: process.env.CLIENT_ID }))"

      - name: Build distributables
        run: npm run dist -- --publish never

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe dist/*.AppImage dist/*-mac.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no distributables produced" >&2
            ls -la dist || true
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  refresh-registry:
    # The index embeds latest-release info (incl. asset checksums the
    # self-updater verifies) - refresh it as soon as all builds are attached.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Kick the registry refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run registry-refresh.yml --ref main -R "$GITHUB_REPOSITORY"

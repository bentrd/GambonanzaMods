# Front desk for "Submit a mod" issues (the form in
# ISSUE_TEMPLATE/mod-submission.yml).
#
# The issue itself IS the submission now: the registry index builder lists
# every open, well-formed submission issue in the mod manager as an
# UNREVIEWED mod (players get a warning before installing one). A maintainer
# reviews the source, adds registry/mods/<id>.json and closes the issue -
# that flips the listing to the reviewed badge. Closing without adding the
# file just delists it. No pull request bot anymore.
#
# This workflow only does the fast feedback: validate the form the moment it
# is opened or edited, comment problems back, and kick the registry refresh
# so the listing appears (or updates, or disappears on close) within minutes
# instead of waiting for the hourly cron.
#
# Security posture: the issue body is untrusted input. It is parsed and
# validated by the same Node code the registry CI uses (strict patterns on
# id/repo/folder, length caps on everything), and no user string is ever
# interpolated into a shell command.
#
# Detection is by the form's headings, not the label: template labels are
# silently dropped when the label doesn't exist in the repo, and real
# submissions have arrived label-less.
name: Mod submission check

on:
  issues:
    types: [opened, edited, closed, reopened]

permissions:
  contents: read
  issues: write
  # gh workflow run registry-refresh.yml
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse and validate the submission
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          node <<'EOF'
          const { appendFileSync, writeFileSync } = require('node:fs');

          async function main() {
            const { parseSubmissionIssue, validateEntry, loadEntries } =
              await import(`${process.cwd()}/tools/registry/lib.mjs`);

            const entry = parseSubmissionIssue(process.env.ISSUE_BODY, {
              author: process.env.ISSUE_USER,
              createdAt: new Date().toISOString(),
            });
            if (!entry) {
              // Not the submission form - some unrelated issue. Do nothing.
              appendFileSync(process.env.GITHUB_OUTPUT, 'submission=false\n');
              return;
            }

            const problems = validateEntry(entry, `${entry.id}.json`);

            // Same collision rules the index builder enforces: an id that
            // already exists belongs to someone's live mod - a submission must
            // never be able to repoint its download - and two mods can't share
            // an install folder.
            const existing = await loadEntries();
            if (!problems.length) {
              if (existing.some(({ entry: reg }) => reg.id === entry.id)) {
                problems.push(`the id "${entry.id}" is already taken by an existing registry entry. `
                  + 'If this is your own mod and you want to change its entry, open a pull request '
                  + `editing registry/mods/${entry.id}.json instead. Otherwise pick a different id.`);
              } else if (existing.some(({ entry: reg }) => String(reg.folder).toLowerCase() === entry.folder.toLowerCase())) {
                problems.push(`the install folder "${entry.folder}" is already taken by another mod - pick a different one.`);
              }
            }

            appendFileSync(process.env.GITHUB_OUTPUT, 'submission=true\n');
            if (problems.length) {
              writeFileSync('/tmp/problems.md', problems.map((p) => `- ${p}`).join('\n'));
              appendFileSync(process.env.GITHUB_OUTPUT, 'valid=false\n');
            } else {
              appendFileSync(process.env.GITHUB_OUTPUT, 'valid=true\n');
            }
          }
          main().catch((err) => { console.error(err); process.exit(1); });
          EOF

      - name: Reply with validation problems
        if: >-
          steps.parse.outputs.submission == 'true' && steps.parse.outputs.valid == 'false'
          && (github.event.action == 'opened' || github.event.action == 'edited')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Thanks for the submission! A few things need fixing before it can be listed:"
            echo
            cat /tmp/problems.md
            echo
            echo "Edit the issue (three-dot menu → Edit) and I'll re-check automatically."
          } > /tmp/comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md

      - name: Acknowledge a valid submission (once)
        if: >-
          steps.parse.outputs.submission == 'true' && steps.parse.outputs.valid == 'true'
          && (github.event.action == 'opened' || github.event.action == 'edited')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only ack once per issue - edits after a good ack stay silent.
          acked="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            --jq '[.[] | select(.body | contains("<!-- mod-submission-ack -->"))] | length')"
          if [ "$acked" != "0" ]; then
            echo "already acknowledged"
            exit 0
          fi
          {
            echo "Thanks - your submission is valid! Here's what happens next:"
            echo
            echo "- Your mod appears in the mod manager within the hour, marked **unreviewed**."
            echo "  Players are warned that nobody has checked the code yet and pointed at your source."
            echo "- A maintainer will read your source. If it passes, your mod gets the **reviewed**"
            echo "  badge and this issue is closed - that's the good ending, not a rejection."
            echo "- No release published yet? The entry shows as \"coming soon\" and switches to"
            echo "  installable automatically once you publish one with the asset attached."
            echo
            echo "Editing this issue updates the listing on the next refresh."
            echo
            echo "<!-- mod-submission-ack -->"
          } > /tmp/comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md

      - name: Refresh the registry index now
        if: steps.parse.outputs.submission == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The hourly cron would get there eventually; this makes the listing
          # follow the issue (open → listed, closed → delisted) within minutes.
          gh workflow run registry-refresh.yml --ref main || true

# Packaging for the three desktop platforms. Built by CI
# (.github/workflows/manager-release.yml); `npm run dist` works locally too.
appId: io.github.bentrd.gambonanza-mod-manager
productName: Gambonanza Mod Manager
copyright: © bentrd — MIT licensed

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  # The registry index bundled as the offline fallback. Written at build time
  # by CI (cp ../../registry/index.json assets/registry-index.json) right
  # before electron-builder runs.
  - assets/**/*
  - "!**/*.map"

asar: true

# One committed 512x512 PNG (generated by tools/make-icon.mjs) - electron-builder
# converts it to .icns/.ico per platform at build time.
mac:
  category: public.app-category.games
  target:
    - target: dmg
      arch: [arm64, x64]
    # the zip feeds the in-app self-updater (dmg stays the human download)
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  # No Apple developer account: ship unsigned and let the site explain the
  # right-click-Open dance. hardenedRuntime stays on so a future cert Just Works.
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  title: Gambonanza Mod Manager
  writeUpdateInfo: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Game
  synopsis: Mod manager for Gambonanza

# GitHub Releases hosts the artifacts; the app has its own update check, so
# electron-updater metadata files are not needed.
publish: null
